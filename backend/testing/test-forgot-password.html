<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password Test</title>
</head>
<body>

    <h2>Step 1: Request Recovery Link</h2>
    <form id="forgotForm">
        <label>Email: <input type="email" name="email" id="resetEmail" required></label>
        <button type="submit">Send Recovery Link</button>
    </form>

    <hr>

    <h2>Step 2: Complete Recovery</h2>
    <form id="resetForm">
        <label>Recovery Token: <input type="text" name="token" id="resetToken" required></label>
        <label>New Password: <input type="password" name="new_password" id="newPassword"></label>
        <button type="submit">Reset Password</button>
    </form>

    <hr>

    <h3>Result:</h3>
    <pre id="result"></pre>

    <script>
        const resultBox = document.getElementById('result');

        function showResult(data) {
            resultBox.textContent = JSON.stringify(data, null, 2);
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('../auth/request_reset.php', {
                method: 'POST',
                body: new FormData(e.target),
            });
            showResult(await response.json());
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('../auth/verify_reset.php', {
                method: 'POST',
                body: new URLSearchParams(formData),
            });
            showResult(await response.json());
        });
    </script>
</body>
</html>
