<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password Test</title>
</head>
<body>

    <h2>Step 1: Request Code</h2>
    <form id="forgotForm">
        <label>Email: <input type="email" name="email" id="resetEmail" value="renzguimba@gmail.com"></label>
        <button type="submit">Send Reset Code</button>
    </form>

    <hr>

    <h2>Step 2: Verify Code</h2>
    <form id="verifyForm">
        <label>Code: <input type="text" name="otp_code" id="otpCode" maxlength="6"></label>
        <button type="submit">Verify Code</button>
    </form>

    <hr>

    <h2>Step 3: Set New Password</h2>
    <form id="resetForm">
        <label>New Password: <input type="password" name="new_password" id="newPassword"></label>
        <button type="submit">Reset Password</button>
    </form>

    <hr>

    <h3>Result:</h3>
    <pre id="result"></pre>

    <script>
        const resultBox = document.getElementById('result');

        function showResult(data) {
            resultBox.textContent = JSON.stringify(data, null, 2);
        }

        //  Request code
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            formData.append('action', 'forgot-password');

            const response = await fetch('routes/auth.php', { method: 'POST', body: formData });
            const data = await response.json();
            showResult(data);
        });

        //  Verify code
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            formData.append('action', 'verify-otp');
            formData.append('email', document.getElementById('resetEmail').value);

            const response = await fetch('routes/auth.php', { method: 'POST', body: formData });
            const data = await response.json();
            showResult(data);
        });

        //  Reset password
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            formData.append('action', 'reset-password');

            const response = await fetch('routes/auth.php', { method: 'POST', body: formData });
            const data = await response.json();
            showResult(data);
        });
    </script>
</body>
</html>
