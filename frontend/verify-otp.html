<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Code — WRS Accounting</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/login-style.css">
</head>
<body class="login-page-glass">

<svg class="wave-bg" viewBox="0 0 1600 900" preserveAspectRatio="none">
    <path fill="#0d3b66" opacity="0.55" d="M0,650 C400,750 1200,550 1600,680 L1600,900 L0,900 Z"></path>
    <path fill="#0a2a4a" opacity="0.75" d="M0,720 C500,820 1100,650 1600,760 L1600,900 L0,900 Z"></path>
</svg>

<div class="login-card-glass">

    <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="droplet-icon d-inline-flex mb-3"></span>
        <h1 class="brand-font h4 mb-0 text-white">Enter Code</h1>
        <p class="text-white-50 small mb-0">We sent a 6-digit code to <span id="emailDisplay"></span></p>
    </div>

    <form id="verifyForm" novalidate>
        <div style="margin-bottom: 1rem;">
            <label for="otpCode" class="form-label small fw-semibold text-white">Verification Code</label>
            <input type="text" class="form-control form-control-glass" id="otpCode" name="otp_code"
                   placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]{6}"
                   style="letter-spacing: 6px; text-align: center; font-size: 1.25rem;" required>
        </div>

        <button type="submit" class="btn btn-glass w-100 mt-2" id="submitBtn">Verify Code</button>

        <div id="errorMsg" class="alert alert-danger py-2 px-3 mt-3 mb-0 small d-none"></div>
    </form>

    <p style="text-align: center; margin-top: 1.5rem;" class="small mb-0">
        Didn't get a code?
        <a href="forgot-password.html" class="text-white-50 text-decoration-none">Try again</a>
    </p>

</div>

<script src="js/verify-otp.js"></script>
</body>
</html>
