<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login — WRS Accounting</title>
       
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/login-style.css">
    </head>



    <body class="login-page-glass">

        <svg class="wave-bg" viewBox="0 0 1600 900" preserveAspectRatio="none">
            <path fill="#0d3b66" opacity="0.55" d="M0,650 C400,750 1200,550 1600,680 L1600,900 L0,900 Z"></path>
            <path fill="#0a2a4a" opacity="0.75" d="M0,720 C500,820 1100,650 1600,760 L1600,900 L0,900 Z"></path>
        </svg>

        <div class="login-card-glass">

            <div style="text-align: center; margin-bottom: 1.5rem;">
                <span class="droplet-icon d-inline-flex mb-3"></span>
                <h1 class="brand-font h4 mb-0 text-white">LedgerFlow</h1>
                <p class="text-white-50 small mb-0">Business Accounting Management System</p>
            </div>

            <form id="loginForm" novalidate>
                    <input type="hidden" name="action" value="login">

                    <div style="margin-bottom: 1rem;">
                        <label for="email" class="form-label small fw-semibold text-white">Email</label>
                        <input type="email" class="form-control form-control-glass" id="email" name="email" placeholder="you@business.com" required>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label for="password" class="form-label small fw-semibold text-white">Password</label>
                        <input type="password" class="form-control form-control-glass" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <div style="text-align: right; margin-bottom: 1rem;">
                    <a href="forgot-password.html" class="small text-decoration-none text-white-50">Forgot password?</a>
                    </div>
                    <input class="form-check-input" type="checkbox" id="rememberMe" name="remember" value="1">
                    <label class="form-check-label" style="color: #fff;" for="rememberMe">Remember me</label>
                    <button type="submit" class="btn btn-glass w-100 mt-2" id="loginBtn">Log In</button>

                    <div id="errorMsg" class="alert alert-danger py-2 px-3 mt-3 mb-0 small d-none"></div>
            </form>

        </div>

        <script src="js/login.js"></script>
    </body>
</html>
