<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>Login — LedgerFlow</title>
        <!-- our system uses bootstrap for styling-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="css/login-style.css">
    </head>


    <!-- the login system-->
    <body class="login-page-glass">

        <div id="suspensionTimer" class="suspension-timer d-none" role="status" aria-live="polite">
            <span class="suspension-timer-label" id="suspensionTimerLabel"></span>
            <span class="suspension-timer-countdown" id="suspensionTimerCountdown"></span>
        </div>

        <!-- the login form-->
        <div class="login-card-glass">

            <!-- login card (glass)-->
            <div style="text-align: center; margin-bottom: 1.5rem;">

                <!-- logo -->
                <span class="droplet-icon d-inline-flex mb-3"></span>

                <!-- logo title-->
                <h1 class="brand-font h4 mb-0 text-white">KoboSocial</h1>

                <!-- logo subtitle-->
                <p style="color: #fff;">Accounting Management System</p>

            </div>

            <form id="loginForm" novalidate> <!-- document.getElementById('loginForm')  at login.js-->
                   
                    <input type="hidden" name="action" value="login">
                    <!-- email field-->
                    <div style="margin-bottom: 1rem;">
                         
                        <!-- ID =  EMAIL -->
                        <label for="email" class="form-label small fw-semibold text-white">Email</label>
                         <input type="email" class="form-control form-control-glass" id="email" name="email" placeholder="email@gmail.com" required>
                   
                  </div>
                    
                    <!-- password field-->
                    <div style="margin-bottom: 1rem;">

                        <label for="password" class="form-label small fw-semibold text-white">Password</label>
                       
                        <div class="password-field-wrapper">
                            <!-- ID =  PASSWORD -->
                            <input type="password" class="form-control form-control-glass" id="password" name="password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-btn" id="togglePassword" aria-label="Show password">
                                👁
                            </button>

                        </div>
                   
                    </div>

                    <!-- forgot password link -->
                    <div style="text-align: right; margin-bottom: 1rem;">
                        
                        <a href="forgot-password.html" style="color: #fff;" >Forgot password?</a>
                    
                    </div>
                    <input class="form-check-input" type="checkbox" id="rememberMe" name="remember" value="1">
                    <label class="form-check-label" style="color: #fff;" for="rememberMe">Remember me</label>
                    <button type="submit" class="btn btn-glass w-100 mt-2" id="loginBtn">Log In</button>

                    <div id="errorMsg" class="alert alert-danger py-2 px-3 mt-3 mb-0 small d-none"></div>
            </form>

        </div>
        <img src="..\frontend\assets\3D_Icon_Kobo.png" class="kobo-logo-side" alt="KoboSocial Logo">
         
         <!-- connection to our login.js-->
        <script src="js/login.js"></script>
    </body>
</html>
