<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Reset Password — WRS Accounting</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/login-style.css">
</head>
<body class="login-page-glass">

<svg class="wave-bg" viewBox="0 0 1600 900" preserveAspectRatio="none">
    <path fill="#0d3b66" opacity="0.55" d="M0,650 C400,750 1200,550 1600,680 L1600,900 L0,900 Z"></path>
    <path fill="#0a2a4a" opacity="0.75" d="M0,720 C500,820 1100,650 1600,760 L1600,900 L0,900 Z"></path>
</svg>

<div class="login-card-glass">

    <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="droplet-icon d-inline-flex mb-3"></span>
        <h1 class="brand-font h4 mb-0 text-white" id="passwordPageTitle">Set New Password</h1>
        <p class="text-white-50 small mb-0" id="passwordPageDescription">Choose a strong password for your account.</p>
    </div>

    <form id="resetForm" novalidate>
        <div style="margin-bottom: 1rem;">
            <label for="newPassword" class="form-label small fw-semibold text-white">New Password</label>
            <div class="password-field-wrapper">
                <input type="password" class="form-control form-control-glass" id="newPassword" name="new_password"
                       placeholder="At least 8 characters" minlength="8" required>
                <button type="button" class="password-toggle-btn" aria-label="Show password" aria-controls="newPassword">
                    <svg class="password-toggle-icon password-toggle-icon-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
                        <circle cx="12" cy="12" r="2.75"></circle>
                    </svg>
                    <svg class="password-toggle-icon password-toggle-icon-hide d-none" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M3 3l18 18"></path>
                        <path d="M10.6 6.2A10.9 10.9 0 0 1 12 6c6.1 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.8"></path>
                        <path d="M6.2 6.3C3.8 8 2.5 12 2.5 12s3.4 6 9.5 6c1.4 0 2.6-.3 3.7-.8"></path>
                        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div style="margin-bottom: 1rem;">
            <label for="confirmPassword" class="form-label small fw-semibold text-white">Confirm Password</label>
            <div class="password-field-wrapper">
                <input type="password" class="form-control form-control-glass" id="confirmPassword"
                       placeholder="Re-enter password" minlength="8" required>
                <button type="button" class="password-toggle-btn" aria-label="Show password" aria-controls="confirmPassword">
                    <svg class="password-toggle-icon password-toggle-icon-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
                        <circle cx="12" cy="12" r="2.75"></circle>
                    </svg>
                    <svg class="password-toggle-icon password-toggle-icon-hide d-none" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M3 3l18 18"></path>
                        <path d="M10.6 6.2A10.9 10.9 0 0 1 12 6c6.1 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.8"></path>
                        <path d="M6.2 6.3C3.8 8 2.5 12 2.5 12s3.4 6 9.5 6c1.4 0 2.6-.3 3.7-.8"></path>
                        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-glass w-100 mt-2" id="submitBtn">Reset Password</button>

        <div id="errorMsg" class="alert alert-danger py-2 px-3 mt-3 mb-0 small d-none"></div>
    </form>

</div>

<script src="js/reset-password.js"></script>
</body>
</html>
