<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify PIN — WRS Accounting</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/login-style.css">
</head>
<body class="login-page-glass">

<svg class="wave-bg" viewBox="0 0 1600 900" preserveAspectRatio="none">
    <path fill="#0d3b66" opacity="0.55" d="M0,650 C400,750 1200,550 1600,680 L1600,900 L0,900 Z"></path>
    <path fill="#0a2a4a" opacity="0.75" d="M0,720 C500,820 1100,650 1600,760 L1600,900 L0,900 Z"></path>
</svg>

<div class="login-card-glass">

    <div class="text-center mb-4">
        <span class="droplet-icon d-inline-flex mb-3"></span>
        <h1 class="brand-font h4 mb-0 text-white">Owner Verification</h1>
        <p class="text-white-50 small mb-0">Enter your 4-digit security PIN to continue.</p>
    </div>

    <form id="pinForm" novalidate>
        <div class="mb-3">
            <label for="pin" class="form-label small fw-semibold text-white">PIN</label>
            <input type="password" class="form-control form-control-glass" id="pin" name="pin"
                   maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="one-time-code"
                   style="letter-spacing: 10px; text-align: center; font-size: 1.5rem;" required autofocus>
        </div>

        <button type="submit" class="btn btn-glass w-100 mt-2" id="verifyPinBtn">Verify</button>

        <div id="errorMsg" class="alert alert-danger py-2 px-3 mt-3 mb-0 small d-none"></div>
    </form>

</div>

<script src="js/verify-pin.js"></script>
</body>
</html>
